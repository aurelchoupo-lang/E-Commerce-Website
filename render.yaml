services:
  - type: web
    name: django-ecommerce-api
    env: python
    rootDir: E-commerce Backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"

  - type: static
    name: django-ecommerce-frontend
    env: static
    rootDir: E-commerce Frontend
    buildCommand: "npm install && npm run build"
    publishDir: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: django-ecommerce-api
          type: web
          property: host
